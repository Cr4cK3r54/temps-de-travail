<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Suivi d'Heures GSF</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Heures GSF">
  
  <!-- Tailwind CSS & html2pdf -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f2f2f7;
    }
    input[type="time"]::-webkit-calendar-picker-indicator {
      background: transparent;
      bottom: 0;
      color: transparent;
      height: auto;
      left: 0;
      position: absolute;
      right: 0;
      top: 0;
      width: auto;
    }
    @media print {
      .no-print { display: none !important; }
      body { background-color: white !important; padding: 0 !important; }
      .print-card { border: 1px solid #e5e7eb !important; box-shadow: none !important; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="text-slate-900 min-h-screen pb-12 pt-4 px-3 sm:px-6 max-w-xl mx-auto">

  <header class="flex justify-between items-center mb-4 no-print pt-2">
    <div>
      <h1 class="text-xl font-bold tracking-tight text-slate-900">Suivi d'Heures</h1>
      <p class="text-xs text-slate-500 font-medium">GSF / Propreté (Nuit : 21h - 06h)</p>
    </div>
    <button onclick="exportPDF()" class="bg-blue-600 active:bg-blue-700 text-white font-semibold text-xs py-2.5 px-4 rounded-xl shadow-sm flex items-center gap-1.5 transition-all">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      Exporter PDF
    </button>
  </header>

  <div class="bg-white rounded-2xl p-3 mb-4 shadow-sm border border-slate-200/80 flex justify-between items-center no-print">
    <button onclick="changeMonth(-1)" class="w-10 h-10 flex items-center justify-center bg-slate-100 active:bg-slate-200 rounded-xl font-bold text-slate-700">
      ❮
    </button>
    <div class="text-center">
      <span id="currentMonthLabel" class="text-base font-bold text-slate-800"></span>
    </div>
    <button onclick="changeMonth(1)" class="w-10 h-10 flex items-center justify-center bg-slate-100 active:bg-slate-200 rounded-xl font-bold text-slate-700">
      ❯
    </button>
  </div>

  <div id="summarySection" class="bg-white rounded-2xl p-4 mb-4 shadow-sm border border-slate-200/80 print-card">
    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 flex items-center justify-between">
      <span>Bilan Mensuel</span>
      <span id="pdfMonthTitle" class="hidden print:inline text-slate-800"></span>
    </h2>
    
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
        <span class="text-xs text-slate-500 font-medium block">Total Travaillé</span>
        <span id="totalWorked" class="text-lg font-bold text-slate-800">0h00</span>
      </div>
      
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
        <span class="text-xs text-slate-500 font-medium block">Base Attendu (7h/j)</span>
        <span id="totalExpected" class="text-lg font-bold text-slate-600">0h00</span>
      </div>

      <div class="bg-indigo-50/70 p-3 rounded-xl border border-indigo-100/80">
        <span class="text-xs text-indigo-600 font-semibold block flex items-center gap-1">
          🌙 Heures de Nuit
        </span>
        <span id="totalNight" class="text-lg font-bold text-indigo-700">0h00</span>
        <span class="text-[10px] text-indigo-400 block font-normal">Plage 21h00 - 06h00</span>
      </div>

      <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
        <span class="text-xs text-slate-500 font-medium block">Solde / Heures Sup</span>
        <span id="totalBalance" class="text-lg font-bold text-slate-800">0h00</span>
      </div>
    </div>
  </div>

  <div id="daysList" class="space-y-3"></div>

  <script>
    let currentDate = new Date();
    // Structure of logs: { 'YYYY-MM-DD': { start: '08:00', end: '16:00', comment: 'GSF Nantes' } }
    let logs = JSON.parse(localStorage.getItem('work_logs_v2') || '{}');

    // Migration from old schema if exists
    const oldLogs = JSON.parse(localStorage.getItem('work_logs') || '{}');
    if (Object.keys(oldLogs).length > 0 && Object.keys(logs).length === 0) {
      for (const k in oldLogs) {
        if (oldLogs[k].hours > 0) {
          // Convert hours number to approximate 08:00 to 08:00+hours
          const h = oldLogs[k].hours;
          const endH = 8 + Math.floor(h);
          const endM = Math.round((h % 1) * 60);
          logs[k] = {
            start: '08:00',
            end: `${String(endH).padStart(2,'0')}:${String(endM).padStart(2,'0')}`,
            comment: oldLogs[k].comment || ''
          };
        }
      }
      localStorage.setItem('work_logs_v2', JSON.stringify(logs));
    }

    function saveLogs() {
      localStorage.setItem('work_logs_v2', JSON.stringify(logs));
      render();
    }

    function changeMonth(offset) {
      currentDate.setMonth(currentDate.getMonth() + offset);
      render();
    }

    function getDaysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    function formatDateKey(year, month, day) {
      return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    // Converts 'HH:MM' string to total minutes from midnight
    function parseTimeToMinutes(timeStr) {
      if (!timeStr) return null;
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    // Format minutes to 'XhYY'
    function formatMinutesToHours(minutes) {
      if (isNaN(minutes) || minutes === 0) return '0h00';
      const isNegative = minutes < 0;
      const absM = Math.abs(minutes);
      const h = Math.floor(absM / 60);
      const m = Math.round(absM % 60);
      return `${isNegative ? '-' : ''}${h}h${String(m).padStart(2, '0')}`;
    }

    /**
     * Calculates total minutes worked and night minutes (21h-06h).
     * Night windows:
     * - Day 1 00:00 - 06:00 (0 to 360 mins)
     * - Day 1 21:00 - Day 2 06:00 (1260 to 1800 mins)
     * - Day 2 21:00 - Day 3 06:00 (2700 to 3240 mins)
     */
    function calculateShift(startStr, endStr) {
      const start = parseTimeToMinutes(startStr);
      let end = parseTimeToMinutes(endStr);

      if (start === null || end === null) return { totalMins: 0, nightMins: 0 };

      // Spans overnight (e.g., 22:00 to 04:00)
      if (end <= start) {
        end += 24 * 60; // Add 24 hours
      }

      const totalMins = end - start;

      // Define night intervals relative to start timeline
      const nightWindows = [
        [0, 360],         // 00:00 - 06:00 day 1
        [1260, 1800],     // 21:00 day 1 - 06:00 day 2
        [2700, 3240]      // 21:00 day 2 - 06:00 day 3
      ];

      let nightMins = 0;
      for (const [wStart, wEnd] of nightWindows) {
        const overlap = Math.max(0, Math.min(end, wEnd) - Math.max(start, wStart));
        nightMins += overlap;
      }

      return { totalMins, nightMins };
    }

    function updateDay(dateKey, field, value) {
      if (!logs[dateKey]) logs[dateKey] = { start: '', end: '', comment: '' };
      logs[dateKey][field] = value;
      saveLogs();
    }

    function render() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysCount = getDaysInMonth(year, month);
      
      const monthName = currentDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      const formattedMonthLabel = monthName.charAt(0).toUpperCase() + monthName.slice(1);
      document.getElementById('currentMonthLabel').innerText = formattedMonthLabel;
      document.getElementById('pdfMonthTitle').innerText = `- ${formattedMonthLabel}`;

      const daysList = document.getElementById('daysList');
      daysList.innerHTML = '';

      let grandTotalMins = 0;
      let grandTotalNightMins = 0;
      let grandTotalExpectedMins = 0;

      for (let day = 1; day <= daysCount; day++) {
        const dateObj = new Date(year, month, day);
        const dayOfWeek = dateObj.getDay(); // 0 = Dimanche, 6 = Samedi
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        const dateKey = formatDateKey(year, month, day);
        const log = logs[dateKey] || { start: '', end: '', comment: '' };

        const dayName = dateObj.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' });
        
        const { totalMins, nightMins } = calculateShift(log.start, log.end);

        grandTotalMins += totalMins;
        grandTotalNightMins += nightMins;

        let dayExpectedMins = 0;
        if (!isWeekend) {
          dayExpectedMins = 7 * 60; // 7h par jour ouvré
          grandTotalExpectedMins += dayExpectedMins;
        }

        // Badges calculation
        let diffMins = totalMins - dayExpectedMins;
        let diffBadge = '';
        if (totalMins > 0) {
          if (diffMins > 0) {
            diffBadge = `<span class="bg-emerald-100 text-emerald-800 text-[11px] font-semibold px-2 py-0.5 rounded-full">+${formatMinutesToHours(diffMins)} sup</span>`;
          } else if (diffMins < 0) {
            diffBadge = `<span class="bg-rose-100 text-rose-800 text-[11px] font-semibold px-2 py-0.5 rounded-full">${formatMinutesToHours(diffMins)}</span>`;
          } else {
            diffBadge = `<span class="bg-blue-100 text-blue-800 text-[11px] font-semibold px-2 py-0.5 rounded-full">7h OK</span>`;
          }
        }

        let nightBadge = '';
        if (nightMins > 0) {
          nightBadge = `<span class="bg-indigo-100 text-indigo-800 text-[11px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1">🌙 ${formatMinutesToHours(nightMins)} nuit</span>`;
        }

        const dayCard = document.createElement('div');
        dayCard.className = `bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/80 print-card ${isWeekend ? 'bg-slate-50/50' : ''}`;
        
        dayCard.innerHTML = `
          <div class="flex justify-between items-center mb-2.5">
            <div class="flex items-center gap-2">
              <span class="font-bold text-sm text-slate-800 uppercase tracking-wide">${dayName}</span>
              ${isWeekend ? '<span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded font-medium">WE</span>' : ''}
            </div>
            <div class="flex items-center gap-1.5">
              ${nightBadge}
              ${diffBadge}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 mb-2">
            <div class="relative bg-slate-50 rounded-xl p-2 border border-slate-200 flex flex-col">
              <label class="text-[10px] font-semibold text-slate-400 uppercase">Début</label>
              <input type="time" value="${log.start || ''}" 
                onchange="updateDay('${dateKey}', 'start', this.value)"
                class="bg-transparent text-sm font-bold text-slate-800 focus:outline-none w-full cursor-pointer">
            </div>

            <div class="relative bg-slate-50 rounded-xl p-2 border border-slate-200 flex flex-col">
              <label class="text-[10px] font-semibold text-slate-400 uppercase">Fin</label>
              <input type="time" value="${log.end || ''}" 
                onchange="updateDay('${dateKey}', 'end', this.value)"
                class="bg-transparent text-sm font-bold text-slate-800 focus:outline-none w-full cursor-pointer">
            </div>
          </div>

          <div class="flex items-center gap-2">
            <input type="text" value="${log.comment || ''}" placeholder="Entreprise (ex: GSF), ville..." 
              onchange="updateDay('${dateKey}', 'comment', this.value)"
              class="bg-slate-50 text-xs text-slate-700 px-3 py-2 rounded-xl border border-slate-200 w-full focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:outline-none transition-all">
          </div>
        `;

        daysList.appendChild(dayCard);
      }

      // Update Summary UI
      document.getElementById('totalWorked').innerText = formatMinutesToHours(grandTotalMins);
      document.getElementById('totalExpected').innerText = formatMinutesToHours(grandTotalExpectedMins);
      document.getElementById('totalNight').innerText = formatMinutesToHours(grandTotalNightMins);

      const netBalanceMins = grandTotalMins - grandTotalExpectedMins;
      const balanceEl = document.getElementById('totalBalance');
      balanceEl.innerText = formatMinutesToHours(netBalanceMins);
      
      if (netBalanceMins > 0) {
        balanceEl.className = 'text-lg font-bold text-emerald-600';
      } else if (netBalanceMins < 0) {
        balanceEl.className = 'text-lg font-bold text-rose-600';
      } else {
        balanceEl.className = 'text-lg font-bold text-slate-800';
      }
    }

    function exportPDF() {
      const element = document.body;
      const monthText = document.getElementById('currentMonthLabel').innerText;
      
      const opt = {
        margin:       8,
        filename:     `Heures_GSF_${monthText.replace(' ', '_')}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    // Initial render
    render();
  </script>
</body>
</html>
