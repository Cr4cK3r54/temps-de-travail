<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Suivi d'Heures</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --text: #000000;
      --accent: #007AFF;
      --success: #34C759;
      --danger: #FF3B30;
      --warning: #FF9500;
      --border: #C6C6C8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 40px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 1.2rem;
      margin: 0;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .nav-month {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .summary-card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .stat-value.positive { color: var(--success); }
    .stat-value.negative { color: var(--danger); }

    .day-card {
      background: var(--card);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .day-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="number"] {
      width: 70px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    .badge.overtime { background: #E8F5E9; color: var(--success); }
    .badge.under { background: #FFEBEE; color: var(--danger); }
    .badge.exact { background: #E3F2FD; color: var(--accent); }

    @media print {
      body { background: white; padding: 0; }
      button, .nav-month button { display: none; }
      .day-card { border: 1px solid #ccc; break-inside: avoid; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Suivi d'Heures</h1>
    <button onclick="exportPDF()">Exporter PDF</button>
  </div>

  <div class="nav-month">
    <button onclick="changeMonth(-1)">❮</button>
    <span id="currentMonthLabel"></span>
    <button onclick="changeMonth(1)">❯</button>
  </div>

  <div class="summary-card">
    <div class="stat">
      <span class="stat-label">Total Travaillé</span>
      <span class="stat-value" id="totalWorked">0 h</span>
    </div>
    <div class="stat">
      <span class="stat-label">Base Attendue (7h/j)</span>
      <span class="stat-value" id="totalExpected">0 h</span>
    </div>
    <div class="stat">
      <span class="stat-label">Heures Sup. (+)</span>
      <span class="stat-value positive" id="totalOvertime">+0 h</span>
    </div>
    <div class="stat">
      <span class="stat-label">Heures Manquantes (-)</span>
      <span class="stat-value negative" id="totalDeficit">-0 h</span>
    </div>
  </div>

  <div id="daysList"></div>

  <script>
    let currentDate = new Date();
    let logs = JSON.parse(localStorage.getItem('work_logs') || '{}');

    function saveLogs() {
      localStorage.setItem('work_logs', JSON.stringify(logs));
      render();
    }

    function changeMonth(offset) {
      currentDate.setMonth(currentDate.getMonth() + offset);
      render();
    }

    function getDaysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    function formatDateKey(year, month, day) {
      return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    function updateDay(dateKey, field, value) {
      if (!logs[dateKey]) logs[dateKey] = { hours: 0, comment: '' };
      if (field === 'hours') logs[dateKey].hours = parseFloat(value) || 0;
      if (field === 'comment') logs[dateKey].comment = value;
      saveLogs();
    }

    function render() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysCount = getDaysInMonth(year, month);
      
      const monthName = currentDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      document.getElementById('currentMonthLabel').innerText = monthName.charAt(0).toUpperCase() + monthName.slice(1);

      const daysList = document.getElementById('daysList');
      daysList.innerHTML = '';

      let totalWorked = 0;
      let totalExpected = 0;
      let totalOvertime = 0;
      let totalDeficit = 0;

      for (let day = 1; day <= daysCount; day++) {
        const dateObj = new Date(year, month, day);
        const dayOfWeek = dateObj.getDay();
        const dateKey = formatDateKey(year, month, day);
        const log = logs[dateKey] || { hours: 0, comment: '' };
        
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        const dayName = dateObj.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' });

        const hours = log.hours;
        totalWorked += hours;

        let badgeHtml = '';
        if (hours > 0) {
          if (!isWeekend) totalExpected += 7;
          
          const diff = hours - (isWeekend ? 0 : 7);
          if (diff > 0) {
            totalOvertime += diff;
            badgeHtml = `<span class="badge overtime">+${diff}h sup</span>`;
          } else if (diff < 0) {
            totalDeficit += Math.abs(diff);
            badgeHtml = `<span class="badge under">${diff}h</span>`;
          } else {
            badgeHtml = `<span class="badge exact">7h ok</span>`;
          }
        }

        const dayCard = document.createElement('div');
        dayCard.className = 'day-card';
        dayCard.innerHTML = `
          <div class="day-header">
            <span>${dayName}</span>
            ${badgeHtml}
          </div>
          <div class="day-inputs">
            <input type="number" step="0.5" min="0" max="24" value="${hours || ''}" placeholder="Heures" 
              onchange="updateDay('${dateKey}', 'hours', this.value)">
            <input type="text" value="${log.comment || ''}" placeholder="Entreprise, ville, note..." 
              onchange="updateDay('${dateKey}', 'comment', this.value)">
          </div>
        `;
        daysList.appendChild(dayCard);
      }

      document.getElementById('totalWorked').innerText = `${totalWorked} h`;
      document.getElementById('totalExpected').innerText = `${totalExpected} h`;
      document.getElementById('totalOvertime').innerText = `+${totalOvertime} h`;
      document.getElementById('totalDeficit').innerText = `-${totalDeficit} h`;
    }

    function exportPDF() {
      const element = document.body;
      const monthText = document.getElementById('currentMonthLabel').innerText;
      const opt = {
        margin:       10,
        filename:     `Heures_${monthText.replace(' ', '_')}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    render();
  </script>
</body>
</html>
